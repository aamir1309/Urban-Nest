<!DOCTYPE html>
<html>
<head>
    <title>Login - Urban Nest</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #0b1f3a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #173b68;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        nav a:hover {
            border-bottom: 2px solid white;
            padding-bottom: 5px;
        }

        #login-container {
            width: 350px;
            background-color: white;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px #cccccc;
        }

        #login-container h2 {
            text-align: center;
            color: #0b1f3a;
        }

        #login-container p {
            text-align: center;
            color: #555555;
        }

        #login-table {
            width: 100%;
        }

        #login-table td {
            padding: 10px 0;
            color: #0b1f3a;
        }

        #login-table input{
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        #login-table a {
            color: #173b68;
            text-decoration: none;
        }

        #login-table a:hover{
            text-decoration: underline;
        }

        #login-button {
            width: 100%;
            padding: 12px;
            background-color: #173b68;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #login-button:hover {
            background-color: #0b1f3a;
        }

        #signup a {
            color: #173b68;
            font-weight: bold;
            text-decoration: none;
        }

        #signup a:hover {
            color: red;
        }

        footer {
            background-color: #173b68;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Urban Nest</h1>
        <p>Find Your Dream Home</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="properties.html">Properties</a>
        <a href="services.html">Services</a>
        <a href="about us.html">About Us</a>
        <a href="contact us.html">Contact Us</a>
        <a href="Login.html">Login</a>
        <a href="sign up.html">Sign Up</a>
    </nav>

    <div id="login-container">

        <h2>Welcome Back!</h2>
        <p>Login to your Urban Nest account</p>

        <form method="post">

            <table id="login-table">

                <tr>
                    <td>
                        <label for="email">Email Address</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="email" id="email"
                        name="email" placeholder="Enter your email"
                        required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="password">Password</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="password" id="password"
                        name="password"
                        placeholder="Enter your password" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <button type="submit" id="login-button">
                            Login
                        </button>
                    </td>
                </tr>

            </table>

        </form>

        <p id="signup">
            Don't have an account?
            <a href="sign up.html">Sign Up</a>
        </p>

    </div>

    <footer>
        <p>&copy; 2026 Urban Nest. All Rights Reserved.</p>
    </footer>

</body>
</html>
