<!DOCTYPE html>
<html>
<head>
    <title>Contact Us - Urban Nest</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #0b1f3a;
            color: white;
            padding: 20px;
        }

        nav {
            background-color: #173b68;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            transition: 0.3s;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            background-image:url(images/real-estate-photographer-cape-town-21.webp)
        }

        h2 {
            color: white;
            text-align: center;
        }

        .contact-info {
            text-align: center;
            margin-bottom: 25px;
            color: white;
        }

        form {
            width: 60%;
            margin: auto;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #173b68;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
        }

        button {
            background-color: #0b1f3a;
            color: white;
            border: none;
            padding: 12px 25px;
            margin-top: 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #173b68;
        }

        footer {
            background-color: #173b68;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
        input:hover {
            background-color: rgb(163, 161, 161);
            
        }
        textarea:hover{
            background-color: rgb(163, 161, 161);
        }
        nav a:hover {
            border-bottom: 2px solid white;
        }
    </style>
</head>

<body>

    <header>
        <center>
         <h1>Urban Nest</h1>
        <p>Find Your Dream Home</p>
        </center>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="properties.html">Properties</a>
        <a href="services.html">Services</a>
        <a href="about us.html">About Us</a>
        <a href="contact us.html">Contact Us</a>
        <a href="Login.html">Login</a>
        <a href="sign up.html">Sign Up</a>
    </nav>

    <div class="container">

        <h2>Contact Us</h2>

        <div class="contact-info">
            <p><b>Address:</b> Ahmedabad, Gujarat, India</p>
            <p><b>Phone:</b> +91 98765 43210</p>
            <p><b>Email:</b> urbannest@gmail.com</p>
        </div>

        <form>

            <label>Name:</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Email:</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Phone:</label>
            <input type="number" placeholder="Enter your phone number" required>

            <label>Message:</label>
            <textarea placeholder="Enter your message" required></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

    <footer>
        <p>© 2026 Urban Nest | Real Estate Website</p>
    </footer>

</body>
</html>
